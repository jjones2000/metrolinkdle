<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80">
  <defs>
    <clipPath id="hexclip">
      <polygon points="8,40 28,10 52,10 72,40 52,70 28,70"/>
    </clipPath>
  </defs>

  <!-- Hex badge -->
  <polygon points="8,40 28,10 52,10 72,40 52,70 28,70" fill="#FFCC00" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Mini network map inside hex -->
  <g clip-path="url(#hexclip)">
    <line x1="40" y1="18" x2="40" y2="62" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="40" x2="62" y2="40" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="58" y2="58" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="22" x2="22" y2="58" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="6" fill="#FFCC00" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="40" cy="20" r="3.5" fill="#1A1A1A"/>
    <circle cx="40" cy="60" r="3.5" fill="#1A1A1A"/>
    <circle cx="20" cy="40" r="3.5" fill="#1A1A1A"/>
    <circle cx="60" cy="40" r="3.5" fill="#1A1A1A"/>
    <circle cx="24" cy="24" r="3" fill="#1A1A1A"/>
    <circle cx="56" cy="56" r="3" fill="#1A1A1A"/>
    <circle cx="56" cy="24" r="3" fill="#1A1A1A"/>
    <circle cx="24" cy="56" r="3" fill="#1A1A1A"/>
  </g>

  <!-- Wordmark -->
  <text x="88" y="52" font-family="'Bebas Neue', Impact, sans-serif" font-size="46" letter-spacing="2" fill="#1A1A1A">METROLINK<tspan fill="#FFCC00">DLE</tspan></text>

  <!-- Line colour dots -->
  <circle cx="90"  cy="66" r="4" fill="#F9A100"/>
  <circle cx="102" cy="66" r="4" fill="#7B2FBE"/>
  <circle cx="114" cy="66" r="4" fill="#3C8BC4"/>
  <circle cx="126" cy="66" r="4" fill="#D4006A"/>
  <circle cx="138" cy="66" r="4" fill="#0057A8"/>
  <line x1="150" y1="66" x2="510" y2="66" stroke="#1A1A1A" stroke-width="1.5" opacity="0.15"/>
</svg>
